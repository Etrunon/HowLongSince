<head>

<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
  :root { color-scheme: light dark; --bg:#fafafa; --fg:#222; --card:#fff; --muted:#777; --accent:#3366cc; }
  @media (prefers-color-scheme: dark) { :root { --bg:#121212; --fg:#eee; --card:#1e1e1e; --muted:#999; --accent:#8ab4f8; } }
  body { font-family: system-ui, sans-serif; background: var(--bg); color: var(--fg); max-width: 640px; margin: 0 auto; padding: 16px; }
  form { display: flex; gap: 8px; margin-bottom: 16px; }
  input { flex: 1; padding: 8px; font-size: 1rem; }
  button { padding: 8px 12px; font-size: 1rem; cursor: pointer; }
  details { background: var(--card); border-radius: 8px; padding: 12px; margin-bottom: 8px; }
  summary { display: flex; justify-content: space-between; align-items: center; gap: 8px; cursor: pointer; list-style: none; }
  .since { font-size: 1.3rem; font-weight: 600; color: var(--accent); }
  .muted { color: var(--muted); font-size: .9rem; }
  ul { padding-left: 16px; }
  li button { padding: 2px 6px; font-size: .8rem; margin-left: 8px; }
  [hidden] { display: none !important; }
  h1 { display: flex; align-items: center; gap: 12px; }
  h1 img { width: 48px; height: 48px; }
  #err { color: #d33; }
  [data-edit] { display: grid; gap: 8px; margin: 12px 0; }
  [data-edit] label { display: grid; gap: 4px; font-size: .9rem; }
  .row { display: flex; gap: 8px; }
  select { padding: 8px; font-size: 1rem; }
</style>
</head>
<body>
<h1><img src="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAxMDAgMTAwIj4KICA8cmVjdCB3aWR0aD0iMTAwIiBoZWlnaHQ9IjEwMCIgcng9IjIyIiBmaWxsPSIjMzM2NmNjIi8+CiAgPGNpcmNsZSBjeD0iNTAiIGN5PSI1MCIgcj0iMzQiIGZpbGw9Im5vbmUiIHN0cm9rZT0iI2ZmZiIgc3Ryb2tlLXdpZHRoPSI2Ii8+CiAgPGcgc3Ryb2tlPSIjZmZmIiBzdHJva2Utd2lkdGg9IjQiIHN0cm9rZS1saW5lY2FwPSJyb3VuZCI+CiAgICA8cGF0aCBkPSJNNTAgMjF2NU03OSA1MGgtNU01MCA3OXYtNU0yMSA1MGg1Ii8+CiAgPC9nPgogIDxwYXRoIGQ9Ik00MCA0MkExMCAxMCAwIDEgMSA1NSA1MC43UTUwIDUzLjUgNTAgNTkiIGZpbGw9Im5vbmUiIHN0cm9rZT0iI2ZmY2MzMyIgc3Ryb2tlLXdpZHRoPSI3IiBzdHJva2UtbGluZWNhcD0icm91bmQiLz4KICA8Y2lyY2xlIGN4PSI1MCIgY3k9IjY5IiByPSI0LjUiIGZpbGw9IiNmZmNjMzMiLz4KPC9zdmc+Cg==" alt="">How Long Since?</h1>
<form id="login" hidden>
  <input name="username" autocomplete="username" value="howlongsince" readonly>
  <input id="token" name="password" type="password" autocomplete="current-password" placeholder="Token" required>
  <button>Log in</button>
</form>
<form id="add"><input id="label" placeholder="New counter" required><button>Add</button></form>
<p id="err"></p>
<div id="list"></div>
<script>
let state = { counters: [], events: [] };
const $ = s => document.querySelector(s);
const esc = s => s.replace(/[&<>"]/g, c => `&#${c.charCodeAt(0)};`);

async function sync(change = { counters: [], events: [] }) {
  let token = localStorage.getItem('token') || '';
  const r = await fetch('sync', { method: 'POST', headers: token ? { Authorization: 'Bearer ' + token } : {}, body: JSON.stringify(change) });
  if (r.status === 401) { $('#login').hidden = false; $('#token').focus(); return; }
  $('#login').hidden = true;
  if (!r.ok) { $('#err').textContent = 'Sync failed: ' + await r.text(); return; }
  $('#err').textContent = '';
  state = await r.json();
  render();
}

function since(ms) {
  const s = Math.max(0, (Date.now() - ms) / 1000), d = Math.floor(s / 86400), h = Math.floor(s % 86400 / 3600), m = Math.floor(s % 3600 / 60);
  return d ? `${d}d ${h}h` : h ? `${h}h ${m}m` : `${m}m`;
}

const event = (counterId, source) => ({ id: crypto.randomUUID(), counterId, at: Date.now(), source, deleted: false });

const UNITS = [['minutes', 6e4], ['hours', 36e5], ['days', 864e5], ['weeks', 6048e5]];
const tagList = s => [...new Set(s.split(',').map(t => t.trim().toLowerCase()).filter(Boolean))]; // same as the app

function editForm(c) {
  const ms = c.notifyAfterMs;
  // Largest unit that divides the stored value evenly, like the app.
  const [unit, size] = ms ? UNITS.filter(([, n]) => ms % n === 0).pop() ?? UNITS[0] : UNITS[2];
  return `<form data-edit="${c.id}">
    <label>Label <input name="label" value="${esc(c.label)}" required></label>
    <label>Tags <input name="tags" value="${esc(tagList(c.tags).join(', '))}" placeholder="comma separated"></label>
    <label>Notify after <span class="row"><input name="amount" type="number" min="1" value="${ms ? ms / size : ''}" placeholder="never">
      <select name="unit">${UNITS.map(([u]) => `<option ${u === unit ? 'selected' : ''}>${u}</option>`).join('')}</select></span></label>
    ${c.nfcTagId ? `<p class="muted">NFC tag paired <button type="button" data-unpair="${c.id}">Unpair</button></p>` : ''}
    <button>Save</button>
  </form>`;
}

function render() {
  if (document.activeElement?.closest('#list form')) return; // don't wipe an edit in progress
  const open = new Set([...document.querySelectorAll('details[open]')].map(d => d.dataset.id));
  const rows = state.counters.filter(c => !c.deleted).map(c => {
    const ev = state.events.filter(e => e.counterId === c.id && !e.deleted).sort((a, b) => b.at - a.at);
    return { c, ev, last: ev[0]?.at ?? 0 };
  }).sort((a, b) => a.last - b.last);
  $('#list').innerHTML = rows.map(({ c, ev, last }) => `
    <details data-id="${c.id}" ${open.has(c.id) ? 'open' : ''}>
      <summary><span><b>${esc(c.label)}</b><br><span class="muted">${tagList(c.tags).map(t => '#' + esc(t)).join(' ')}${c.notifyAfterMs ? ' · ⏰' : ''}</span></span>
        <span class="since">${since(last)}</span><button data-reset="${c.id}">Reset</button></summary>
      ${editForm(c)}
      <ul>${ev.map(e => `<li>${new Date(e.at).toLocaleString()} <span class="muted">${e.source}</span>${ev.length > 1 ? `<button data-del-event="${e.id}">✕</button>` : ''}</li>`).join('')}</ul>
      <button data-del="${c.id}">Delete counter</button>
    </details>`).join('');
}

$('#login').onsubmit = e => {
  e.preventDefault();
  localStorage.setItem('token', $('#token').value);
  sync();
};

$('#add').onsubmit = e => {
  e.preventDefault();
  const c = { id: crypto.randomUUID(), label: $('#label').value.trim(), tags: '', notifyAfterMs: null, nfcTagId: null, updatedAt: Date.now(), deleted: false };
  $('#label').value = '';
  sync({ counters: [c], events: [event(c.id, 'create')] });
};

$('#list').onsubmit = e => {
  e.preventDefault();
  const f = new FormData(e.target), amount = Number(f.get('amount'));
  const c = state.counters.find(x => x.id === e.target.dataset.edit);
  document.activeElement.blur();
  sync({ counters: [{ ...c, label: f.get('label').trim(), tags: tagList(f.get('tags')).join(','),
    notifyAfterMs: amount > 0 ? amount * UNITS.find(([u]) => u === f.get('unit'))[1] : null, updatedAt: Date.now() }], events: [] });
};

$('#list').onclick = e => {
  const d = e.target.dataset;
  if (d.reset) { e.preventDefault(); sync({ counters: [], events: [event(d.reset, 'manual')] }); }
  if (d.delEvent) sync({ counters: [], events: [{ ...state.events.find(x => x.id === d.delEvent), deleted: true }] });
  if (d.unpair) sync({ counters: [{ ...state.counters.find(x => x.id === d.unpair), nfcTagId: null, updatedAt: Date.now() }], events: [] });
  if (d.del && confirm('Delete this counter?'))
    sync({ counters: [{ ...state.counters.find(x => x.id === d.del), deleted: true, updatedAt: Date.now() }], events: [] });
};

sync();
setInterval(sync, 60000); // pick up phone changes, refresh times
</script>
</body>
</html>
