<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>How Long Since?</title>
<link rel="icon" href="icon.svg">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#3366cc">
<style>
  :root { color-scheme: light dark; --bg:#fafafa; --fg:#222; --card:#fff; --muted:#777; --accent:#3366cc; --tag-l:45%; }
  @media (prefers-color-scheme: dark) { :root { --bg:#121212; --fg:#eee; --card:#1e1e1e; --muted:#999; --accent:#8ab4f8; --tag-l:70%; } }
  body { font-family: system-ui, sans-serif; background: var(--bg); color: var(--fg); max-width: 640px; margin: 0 auto; padding: 16px; }
  form { display: flex; gap: 8px; margin-bottom: 16px; }
  input { flex: 1; padding: 8px; font-size: 1rem; }
  button { padding: 8px 12px; font-size: 1rem; cursor: pointer; }
  details { background: var(--card); border-radius: 8px; padding: 12px; margin-bottom: 8px; border-left: 8px solid; } /* first tag's color, like the app */
  summary { display: flex; justify-content: space-between; align-items: center; gap: 8px; cursor: pointer; list-style: none; }
  .since { font-size: 1.3rem; font-weight: 600; color: var(--accent); margin-left: auto; white-space: nowrap; }
  [data-reset] { background: var(--accent); color: var(--bg); border: none; border-radius: 999px; padding: 8px 16px; font-weight: 600; white-space: nowrap; }
  [data-reset]:hover { filter: brightness(1.1); }
  .muted { color: var(--muted); font-size: .9rem; }
  ul { padding-left: 16px; }
  li button { padding: 2px 6px; font-size: .8rem; margin-left: 8px; }
  .chart { width: 100%; height: 56px; fill: var(--accent); }
  [data-del] { background: #d33; color: #fff; border: none; border-radius: 4px; }
  #tags { display: flex; gap: 8px; overflow-x: auto; margin-bottom: 12px; }
  #tags button { display: flex; align-items: center; gap: 6px; border-radius: 8px; border: 1px solid var(--muted); background: none; color: var(--fg); white-space: nowrap; }
  #tags button.on { background: var(--accent); color: var(--bg); border-color: var(--accent); }
  .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
  [hidden] { display: none !important; }
  .sec { position: sticky; top: 0; z-index: 1; display: flex; align-items: center; gap: 8px; padding: 8px 0; background: var(--bg); cursor: pointer; }
  .sec b { color: var(--accent); }
  .sec .muted { flex: 1; text-align: right; font-size: .8rem; }
  .bad { color: #d33; }
  #groups { align-items: center; margin-bottom: 12px; }
  #groups select { flex: 1; }
  h1 { display: flex; align-items: center; gap: 12px; }
  h1 img { width: 48px; height: 48px; }
  #err { color: #d33; }
  [data-edit] { display: grid; gap: 8px; margin: 12px 0; }
  [data-edit] label { display: grid; gap: 4px; font-size: .9rem; }
  .row { display: flex; gap: 8px; }
  select { padding: 8px; font-size: 1rem; }
  .overdue .since { color: #d33; }
  #tools { margin-bottom: 12px; }
  .note { display: block; margin-left: 8px; }
  footer { margin-top: 24px; text-align: center; }
</style>
</head>
<body>
<h1><img src="icon.svg" alt="">How Long Since?</h1>
<form id="login" hidden>
  <input name="username" autocomplete="username" value="howlongsince" readonly>
  <input id="token" name="password" type="password" autocomplete="current-password" placeholder="Token" required>
  <button data-i18n="login">Log in</button>
</form>
<div class="row" id="groups" hidden>
  <select id="group" aria-label="Group"></select>
  <a id="app" href="#" data-i18n="open_app">Open in app</a>
  <button id="rename" data-i18n="rename">Rename</button>
  <button id="forget" data-i18n="forget">Forget</button>
</div>
<div class="row" style="margin-bottom:12px"><button id="newgroup" data-i18n="new_group">New group</button><button id="addgroup" data-i18n="join">Join</button></div>
<div id="main">
<form id="add"><input id="label" data-i18n-ph="new_counter" placeholder="New counter" required><button data-i18n="add">Add</button></form>
<p id="undo" hidden><span></span> <button data-i18n="undo">Undo</button></p>
<div class="row" id="tools"><input id="q" type="search" data-i18n-ph="search" placeholder="Search labels and tags">
  <select id="sort"><option value="due" data-i18n="sort_due">Most overdue</option><option value="recent" data-i18n="sort_recent">Recently reset</option><option value="name" data-i18n="sort_name">Name</option></select></div>
<div id="tags"></div>
<div id="list"></div>
</div>
<p id="err"></p>
<footer><select id="lang" aria-label="Language"><option value="">Auto</option><option value="en">English</option><option value="it">Italiano</option></select></footer>
<script>
const $ = s => document.querySelector(s);
const esc = s => s.replace(/[&<>"]/g, c => `&#${c.charCodeAt(0)};`);

// English and Italian, picked from the browser; same wording as the app's strings.xml.
const T = {
  en: { login: 'Log in', new_counter: 'New counter', add: 'Add', undo: 'Undo', search: 'Search labels and tags',
    sort_due: 'Most overdue', sort_recent: 'Recently reset', sort_name: 'Name',
    unreachable: 'Server unreachable, last change not saved. Retrying every minute.', sync_failed: 'Sync failed: %s',
    label: 'Label', tags: 'Tags', comma: 'comma separated', notify_after: 'Notify after', never: 'never',
    minutes: 'minutes', hours: 'hours', days: 'days', weeks: 'weeks', use_average: 'Use my average (%s)',
    reset_note: 'Reset with a note, or at a past time', note: 'note (optional)', reset: 'Reset',
    nfc_paired: 'NFC tag paired', unpair: 'Unpair', save: 'Save', archive: 'Archive', unarchive: 'Unarchive',
    intervals: 'Intervals · avg %s', archived: 'Archived', delete_counter: 'Delete counter', confirm_delete: 'Delete this counter?',
    reset_label: 'Reset %s', pick_past: 'Pick a time in the past', create: 'created', manual: 'manual', nfc: 'via NFC', d: 'd',
    open_app: 'Open in app', forget: 'Forget', paste_link: 'Paste a group link', bad_link: 'That isn\'t a group link',
        no_data: 'Nothing found for this link on this server', decrypt_failed: 'Can\'t decrypt: wrong key?', needs_https: 'This page needs https to decrypt (or localhost).', busy: 'Busy, try again', all_groups: 'All', ungrouped: 'Ungrouped', synced: 'Synced %s', new_group: 'New group', group_name: 'Group name', rename: 'Rename', join: 'Join', join_question: 'Join «%s»?',
    already_joined: 'Already joined as «%s»', other_server: 'That link is for %s. Open it on that server\'s page.', token: 'Token',
    forget_backup: 'Copy this link first: it is the only backup of the key. OK forgets the group in this browser (the data stays on the server), Cancel keeps it.' },
  it: { login: 'Accedi', new_counter: 'Nuovo contatore', add: 'Aggiungi', undo: 'Annulla', search: 'Cerca tra etichette e tag',
    sort_due: 'Più in ritardo', sort_recent: 'Azzerati di recente', sort_name: 'Nome',
    unreachable: 'Server irraggiungibile, ultima modifica non salvata. Nuovo tentativo ogni minuto.', sync_failed: 'Sincronizzazione non riuscita: %s',
    label: 'Etichetta', tags: 'Tag', comma: 'separati da virgole', notify_after: 'Avvisa dopo', never: 'mai',
    minutes: 'minuti', hours: 'ore', days: 'giorni', weeks: 'settimane', use_average: 'Usa la mia media (%s)',
    reset_note: 'Azzera con una nota, o in un momento passato', note: 'nota (facoltativa)', reset: 'Azzera',
    nfc_paired: 'Tag NFC abbinato', unpair: 'Disabbina', save: 'Salva', archive: 'Archivia', unarchive: 'Ripristina',
    intervals: 'Intervalli · media %s', archived: 'Archiviati', delete_counter: 'Elimina contatore', confirm_delete: 'Eliminare questo contatore?',
    reset_label: 'Azzera %s', pick_past: 'Scegli un momento nel passato', create: 'creato', manual: 'manuale', nfc: 'via NFC', d: 'g',
    open_app: 'Apri nell\'app', forget: 'Dimentica', paste_link: 'Incolla un link di gruppo', bad_link: 'Questo non è un link di gruppo',
        no_data: 'Niente trovato per questo link su questo server', decrypt_failed: 'Impossibile decifrare: chiave sbagliata?', needs_https: 'Questa pagina richiede https per decifrare (o localhost).', busy: 'Occupato, riprova', all_groups: 'Tutti', ungrouped: 'Senza gruppo', synced: 'Sincronizzato alle %s', new_group: 'Nuovo gruppo', group_name: 'Nome del gruppo', rename: 'Rinomina', join: 'Unisciti', join_question: 'Unirti a «%s»?',
    already_joined: 'Già unito come «%s»', other_server: 'Quel link è per %s. Aprilo sulla pagina di quel server.', token: 'Token',
    forget_backup: 'Copia prima questo link: è l\'unico backup della chiave. OK dimentica il gruppo in questo browser (i dati restano sul server), Annulla lo tiene.' },
};
let saved = null; try { saved = localStorage.getItem('lang'); } catch {}
const lang = saved || ((navigator.languages?.[0] || navigator.language).toLowerCase().startsWith('it') ? 'it' : 'en'); // chosen, else first preferred language
document.documentElement.lang = lang;
const t = (k, ...a) => (T[lang][k] ?? T.en[k]).replace(/%s/g, () => a.shift());
document.querySelectorAll('[data-i18n]').forEach(el => el.textContent = t(el.dataset.i18n));
document.querySelectorAll('[data-i18n-ph]').forEach(el => el.placeholder = t(el.dataset.i18nPh));

// Groups this browser knows: { secret, token, name }. The secret never leaves the browser; the server only sees an id derived from it.
let groups = []; try { groups = JSON.parse(localStorage.getItem('groups') || '[]'); } catch {}
const saveGroups = () => localStorage.setItem('groups', JSON.stringify(groups));
const base = location.origin + location.pathname.replace(/[^/]*$/, '').replace(/\/$/, ''); // this server, also under a sub-path

const b64u = s => Uint8Array.from(atob(s.replace(/-/g, '+').replace(/_/g, '/')), c => c.charCodeAt(0));
const b64 = u => { let s = ''; for (const b of u) s += String.fromCharCode(b); return btoa(s); };
const hex = u => [...u].map(b => b.toString(16).padStart(2, '0')).join('');
const validSecret = s => { try { return b64u(s).length === 32; } catch { return false; } };

// Same scheme as the app (Crypto.kt): HKDF-SHA256 with a zero salt makes the server-side id and the AES-256-GCM key; the id is also the authenticated data.
async function deriveKeys(secret) {
  const ikm = await crypto.subtle.importKey('raw', b64u(secret), 'HKDF', false, ['deriveBits']);
  const bits = (info, n) => crypto.subtle.deriveBits({ name: 'HKDF', hash: 'SHA-256', salt: new Uint8Array(32), info: new TextEncoder().encode(info) }, ikm, n);
  return { id: hex(new Uint8Array(await bits('hls id', 128))), key: await crypto.subtle.importKey('raw', await bits('hls key', 256), 'AES-GCM', false, ['encrypt', 'decrypt']) };
}
const aad = k => new TextEncoder().encode(k.id);
const unseal = async (k, blob) => JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({ name: 'AES-GCM', iv: blob.slice(0, 12), additionalData: aad(k) }, k.key, blob.slice(12))));
async function seal(k, obj) {
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = new Uint8Array(await crypto.subtle.encrypt({ name: 'AES-GCM', iv, additionalData: aad(k) }, k.key, new TextEncoder().encode(JSON.stringify(obj))));
  return Uint8Array.from([...iv, ...ct]);
}

// The server can't merge encrypted data, so the browser does: counters by newest updatedAt, events by union (deletion is sticky), old tombstones dropped.
function merge(s, inn) {
  const cs = new Map();
  for (const c of [...s.counters, ...inn.counters]) { const o = cs.get(c.id); if (!o || c.updatedAt > o.updatedAt) cs.set(c.id, c); }
  const es = new Map();
  for (let e of [...s.events, ...inn.events]) {
    const o = es.get(e.id);
    if (o) { e = { ...e, deleted: e.deleted || o.deleted }; if (!e.note && o.note) e.note = o.note; }
    es.set(e.id, e);
  }
  const cutoff = Date.now() - 90 * 864e5, byId = (a, b) => a.id < b.id ? -1 : a.id > b.id ? 1 : 0;
  const counters = [...cs.values()].filter(c => !c.deleted || c.updatedAt >= cutoff).sort(byId);
  const live = new Set(counters.map(c => c.id));
  const rename = inn.name != null && inn.nameUpdatedAt > (s.nameUpdatedAt ?? 0); // newest rename wins, like the phone
  return { name: rename ? inn.name : s.name, nameUpdatedAt: rename ? inn.nameUpdatedAt : s.nameUpdatedAt, counters, events: [...es.values()].filter(e => live.has(e.counterId)).sort(byId) };
}

const emptyState = () => ({ name: null, nameUpdatedAt: 0, counters: [], events: [] });
// One store per group (keyed by its secret), decrypted, plus '' for Ungrouped, which never leaves this browser.
const stores = new Map();
const store = k => stores.get(k) ?? stores.set(k, { state: emptyState(), etag: null, keys: null, status: '', failed: false, queue: Promise.resolve() }).get(k);
try { Object.assign(store('').state, JSON.parse(localStorage.getItem('local') || '{}')); } catch {}
const ownerOf = id => [...stores].find(([, s]) => s.state.counters.some(c => c.id === id))?.[0];
const ownerOfEvent = id => [...stores].find(([, s]) => s.state.events.some(e => e.id === id))?.[0];
const counterOf = id => stores.get(ownerOf(id))?.state.counters.find(c => c.id === id);
let view = 'all'; // what the list shows: 'all', '' (Ungrouped) or a group's secret
let loginFor = null;
const fail = msg => { $('#err').textContent = msg; return false; };
const headers = g => { const t = g.token || localStorage.getItem('token') || ''; return t ? { Authorization: 'Bearer ' + t } : {}; };

/** Fetches and decrypts group [k] into its store. False (the reason is its status) if it couldn't. */
async function pull(k) {
  const g = groups.find(g => g.secret === k), s = store(k);
  if (!g) return false;
  const bad = msg => { s.status = msg; s.failed = true; render(); return false; };
  if (!crypto.subtle) return bad(t('needs_https'));
  s.keys ??= await deriveKeys(k);
  let r;
  try { r = await fetch(`${base}/s/${s.keys.id}`, { headers: headers(g) }); } catch { return bad(t('unreachable')); }
  if (r.status === 401) { loginFor = k; $('#login').hidden = false; $('#token').focus(); return bad(t('wrong_token')); }
  if (r.status === 404) {
    if (!g.fresh) { s.etag = null; return bad(t('no_data')); }
    s.etag = null; if (!s.state.name) s.state = { ...emptyState(), name: g.name, nameUpdatedAt: g.nameUpdatedAt }; // made here, not uploaded yet
    return true;
  }
  if (!r.ok) return bad(t('sync_failed', await r.text()));
  const j = await r.json();
  try { s.state = await unseal(s.keys, b64u(j.ciphertext)); } catch { return bad(t('decrypt_failed')); }
  s.etag = j.etag; s.failed = false; s.status = t('synced', new Date().toLocaleTimeString([], { timeStyle: 'short' }));
  if (loginFor === k) { $('#login').hidden = true; loginFor = null; }
  if (g.name !== s.state.name) { g.name = s.state.name || ''; saveGroups(); }
  return true;
}

// One change at a time per store: pull, merge, push, and a 409 (someone else wrote in between) starts over. Ungrouped is just a local merge.
const commit = (k, change = { counters: [], events: [] }) => {
  const s = store(k);
  return s.queue = s.queue.then(() => run(k, change)).catch(e => { s.status = String(e); s.failed = true; render(); });
};
async function run(k, change) {
  const s = store(k), has = change.counters.length || change.events.length || change.name != null;
  if (k === '') { if (has) { s.state = merge(s.state, change); localStorage.setItem('local', JSON.stringify(s.state)); } return render(); }
  for (let i = 0; i < 5; i++) {
    if (!await pull(k)) return;
    const g = groups.find(g => g.secret === k);
    if (!has && !g.fresh) return render();
    const next = merge(s.state, change), mine = s.etag;
    const r = await fetch(`${base}/s/${s.keys.id}`, { method: 'PUT', headers: { ...headers(groups.find(g => g.secret === k)), ...(mine && { 'If-Match': mine }) },
      body: JSON.stringify({ ciphertext: b64(await seal(s.keys, next)) }) });
    if (r.ok) { s.state = next; s.etag = (await r.json()).etag; if (g.fresh) { delete g.fresh; saveGroups(); } return render(); }
    if (r.status !== 409) { s.status = t('sync_failed', await r.text()); s.failed = true; return render(); }
  }
  s.status = t('busy'); s.failed = true; render();
}
const syncAll = () => Promise.all(['', ...groups.map(g => g.secret)].map(k => commit(k)));

const shareLink = g => `${base}/#k=${g.secret}${g.token ? '&t=' + encodeURIComponent(g.token) : ''}`;
const defaultToken = () => localStorage.getItem('token') || groups.find(g => g.token)?.token || '';
const uniqueName = (name, taken) => { let n = name, i = 1; while (taken.some(x => x.toLowerCase() === n.toLowerCase())) n = `${name} (${++i})`; return n; };
const byName = (a, b) => (a.name || '￿').localeCompare(b.name || '￿');
function fillGroups() {
  const opts = [['all', t('all_groups')]];
  if (groups.length) {
    if (store('').state.counters.some(c => !c.deleted)) opts.push(['', t('ungrouped')]);
    [...groups].sort(byName).forEach(g => opts.push([g.secret, g.name || '…']));
  }
  const html = opts.map(([v, n]) => `<option value="${esc(v)}">${esc(n)}</option>`).join('');
  if ($('#group').dataset.h !== html) { $('#group').innerHTML = html; $('#group').dataset.h = html; } // leave an open dropdown alone
  if (!opts.some(o => o[0] === view)) view = 'all';
  $('#group').value = view;
  $('#groups').hidden = !groups.length;
  const g = groups.find(g => g.secret === view);
  $('#app').hidden = $('#rename').hidden = $('#forget').hidden = !g;
  if (g) $('#app').href = `howlongsince://join?h=${encodeURIComponent(base)}#k=${g.secret}${g.token ? '&t=' + encodeURIComponent(g.token) : ''}`;
}

/** The server a pasted link points at, or null for just a `#k=...` part (which means this one). */
const linkServer = link => {
  if (link.startsWith('howlongsince:')) { try { return new URL(link).searchParams.get('h'); } catch { return null; } }
  return /^https?:/.test(link) ? link.split('#')[0] : null;
};

/** Reads a group's name from its blob, asking for the token if the server wants one. Null if nothing is stored under the key. */
async function peek(secret, token) {
  const keys = await deriveKeys(secret);
  for (;;) {
    const r = await fetch(`${base}/s/${keys.id}`, { headers: headers({ token }) });
    if (r.status === 401) { token = prompt(t('token')); if (token) continue; throw new Error(t('wrong_token')); }
    if (r.status === 404) return null;
    if (!r.ok) throw new Error(t('sync_failed', await r.text()));
    return { state: await unseal(keys, b64u((await r.json()).ciphertext)), token };
  }
}

/** Joins the group in a link: its `#k=...&t=...` part, whole or alone. Shows the name and asks first, like the phone. */
async function join(link) {
  link = link.trim();
  const server = linkServer(link);
  if (server && server.replace(/\/$/, '') !== base) return alert(t('other_server', server));
  const p = new URLSearchParams(link.includes('#') ? link.split('#')[1] : link), secret = p.get('k');
  if (!secret || !validSecret(secret)) return alert(t('bad_link'));
  const known = groups.find(g => g.secret === secret);
  if (known) { view = secret; render(); return alert(t('already_joined', known.name || '…')); }
  if (!crypto.subtle) return alert(t('needs_https'));
  try {
    const found = await peek(secret, p.get('t') || '');
    if (!found) return alert(t('no_data'));
    if (!confirm(t('join_question', found.state.name || '…'))) return;
    groups.push({ secret, token: found.token, name: found.state.name || '' });
    view = secret; saveGroups(); render(); commit(secret);
  } catch (e) { alert(e instanceof TypeError ? t('unreachable') : e.name === 'OperationError' ? t('decrypt_failed') : e.message); }
}

/** A new group: a random key made here, the first blob uploaded as soon as the server answers. */
function newGroup() {
  const name = prompt(t('group_name'))?.trim();
  if (!name) return;
  if (!crypto.subtle) return alert(t('needs_https'));
  const secret = b64(crypto.getRandomValues(new Uint8Array(32))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
  groups.push({ secret, token: defaultToken(), name: uniqueName(name, groups.map(g => g.name)), nameUpdatedAt: Date.now(), fresh: true });
  view = secret; saveGroups(); render(); commit(secret);
}

function renameGroup() {
  const g = groups.find(g => g.secret === view), name = prompt(t('group_name'), g.name)?.trim();
  if (!name || name === g.name) return;
  g.name = uniqueName(name, groups.filter(x => x !== g).map(x => x.name)); saveGroups(); render();
  commit(g.secret, { counters: [], events: [], name: g.name, nameUpdatedAt: Date.now() });
}

function forgetGroup() {
  const g = groups.find(g => g.secret === view);
  if (prompt(t('forget_backup'), shareLink(g)) === null) return; // a text box, so the link can be copied
  groups = groups.filter(x => x !== g); stores.delete(g.secret); view = 'all'; saveGroups(); render();
}

function since(ms) {
  const s = Math.max(0, (Date.now() - ms) / 1000), d = Math.floor(s / 86400), h = Math.floor(s % 86400 / 3600), m = Math.floor(s % 3600 / 60);
  return d ? `${d}${t('d')} ${h}h` : h ? `${h}h ${m}m` : `${m}m`;
}

const event = (counterId, source, at = Date.now()) => ({ id: crypto.randomUUID(), counterId, at, source, deleted: false });

const UNITS = [['minutes', 6e4], ['hours', 36e5], ['days', 864e5], ['weeks', 6048e5]];
const tagList = s => [...new Set(s.split(',').map(t => t.trim().toLowerCase()).filter(Boolean))]; // same as the app

function editForm(c, avg) {
  const ms = c.notifyAfterMs;
  // Largest unit that divides the stored value evenly, like the app.
  const [unit, size] = ms ? UNITS.filter(([, n]) => ms % n === 0).pop() ?? UNITS[0] : UNITS[2];
  return `<form data-edit="${c.id}">
    <label>${t('label')} <input name="label" value="${esc(c.label)}" required></label>
    <label>${t('tags')} <input name="tags" value="${esc(tagList(c.tags).join(', '))}" placeholder="${t('comma')}"></label>
    <label>${t('notify_after')} <span class="row"><input name="amount" type="number" min="1" value="${ms ? ms / size : ''}" placeholder="${t('never')}">
      <select name="unit">${UNITS.map(([u]) => `<option value="${u}" ${u === unit ? 'selected' : ''}>${t(u)}</option>`).join('')}</select>
      ${avg ? `<button type="button" data-avg="${avg}">${t('use_average', since(Date.now() - avg))}</button>` : ''}</span></label>
    <label>${t('reset_note')} <span class="row"><input name="note" placeholder="${t('note')}"><input type="datetime-local" name="at"><button type="button" data-reset-at="${c.id}">${t('reset')}</button></span></label>
    ${c.nfcTagId ? `<p class="muted">${t('nfc_paired')} <button type="button" data-unpair="${c.id}">${t('unpair')}</button></p>` : ''}
    <span class="row"><button>${t('save')}</button><button type="button" data-archive="${c.id}">${t(c.archived ? 'unarchive' : 'archive')}</button></span>
  </form>`;
}

/** Bars of the intervals between resets, oldest left, last 30; same as the app's IntervalChart. */
function chart(ev) {
  const gaps = ev.slice(0, -1).map((e, i) => e.at - ev[i + 1].at).reverse().slice(-30);
  if (gaps.length < 2) return '';
  const max = Math.max(...gaps, 1), w = 100 / gaps.length;
  const avg = gaps.reduce((a, b) => a + b) / gaps.length;
  return `<p class="muted">${t('intervals', since(Date.now() - avg))}</p>
    <svg class="chart" viewBox="0 0 100 56" preserveAspectRatio="none">${gaps.map((g, i) => {
      const h = Math.max(g / max * 56, 1.5);
      return `<rect x="${i * w + w * .15}" y="${56 - h}" width="${w * .7}" height="${h}"><title>${since(Date.now() - g)}</title></rect>`;
    }).join('')}</svg>`;
}

// Same hue as the app's tagColor: Java String.hashCode() mod 360.
const tagHue = t => { let h = 0; for (const ch of t) h = Math.imul(h, 31) + ch.charCodeAt(0) | 0; return (h % 360 + 360) % 360; };
const dot = t => `<i class="dot" style="background:hsl(${tagHue(t)} 55% var(--tag-l))"></i>`;
let filter = null, showArchived = false;
let folded = new Set(); try { folded = new Set(JSON.parse(localStorage.getItem('folded') || '[]')); } catch {}
$('#sort').value = localStorage.getItem('sort') || 'due';

const rowsOf = k => { const { counters, events } = store(k).state; return counters.filter(c => !c.deleted).map(c => {
  const ev = events.filter(e => e.counterId === c.id && !e.deleted).sort((a, b) => b.at - a.at), last = ev[0]?.at ?? 0;
  return { c, ev, last, k, overdue: c.notifyAfterMs != null && Date.now() - last >= c.notifyAfterMs };
}); };
const groupName = k => k === '' ? t('ungrouped') : groups.find(g => g.secret === k)?.name || '…';

function rowHtml({ c, ev, last, k, overdue }) {
  return `
    <details data-id="${c.id}" class="${overdue ? 'overdue' : ''}" ${openIds.has(c.id) ? 'open' : ''} style="border-left-color:${tagList(c.tags).length ? `hsl(${tagHue(tagList(c.tags)[0])} 55% var(--tag-l))` : 'var(--card)'}">
      <summary><span><b>${esc(c.label)}</b><br>${k && groups.length >= 2 ? `<span class="muted">${esc(groupName(k))}</span><br>` : ''}<span class="muted">${tagList(c.tags).map(t => '#' + esc(t)).join(' ')}${c.notifyAfterMs ? ' · ⏰' : ''}</span></span>
        <span class="since">${since(last)}</span><button data-reset="${c.id}">↻ ${t('reset')}</button></summary>
      ${chart(ev)}
      ${editForm(c, ev.length >= 3 ? (ev[0].at - ev.at(-1).at) / (ev.length - 1) : 0)}
      <ul>${ev.map(e => `<li>${new Date(e.at).toLocaleString()} <span class="muted">${t(e.source)}</span>${ev.length > 1 ? `<button data-del-event="${e.id}">✕</button>` : ''}${e.note ? `<span class="note">${esc(e.note)}</span>` : ''}</li>`).join('')}</ul>
      <button data-del="${c.id}">${t('delete_counter')}</button>
    </details>`;
}

let openIds = new Set();
function render() {
  if (document.activeElement?.closest('#list form')) return; // don't wipe an edit in progress
  fillGroups();
  openIds = new Set([...document.querySelectorAll('details[open]')].map(d => d.dataset.id));
  const pool = (view === 'all' ? ['', ...groups.map(g => g.secret)] : [view]).flatMap(rowsOf);
  const hasArchived = pool.some(r => r.c.archived);
  if (!hasArchived) showArchived = false;
  const live = pool.filter(r => !!r.c.archived === showArchived);
  const allTags = [...new Set(live.flatMap(r => tagList(r.c.tags)))].sort();
  if (!allTags.includes(filter)) filter = null;
  $('#tags').innerHTML = allTags.map(t => `<button data-tag="${esc(t)}" class="${t === filter ? 'on' : ''}">${dot(t)}${esc(t)}</button>`).join('')
    + (hasArchived ? `<button data-archived class="${showArchived ? 'on' : ''}">${t('archived')}</button>` : '');
  const q = $('#q').value.trim().toLowerCase(), sort = $('#sort').value;
  const shown = live.filter(r => !filter || tagList(r.c.tags).includes(filter))
    .filter(r => !q || r.c.label.toLowerCase().includes(q) || r.c.tags.includes(q));
  const order = sort === 'name' ? (a, b) => a.c.label.localeCompare(b.c.label)
    : sort === 'recent' ? (a, b) => b.last - a.last
    : (a, b) => b.overdue - a.overdue || a.last - b.last; // overdue first, then oldest reset
  // Sections (one per group, Ungrouped first) while looking at everything and at least one group exists; sorted within each.
  $('#list').innerHTML = !(view === 'all' && groups.length) ? shown.sort(order).map(rowHtml).join('')
    : ['', ...[...groups].sort(byName).map(g => g.secret)].map(k => {
      const rows = shown.filter(r => r.k === k).sort(order), s = store(k);
      if (!rows.length && !s.failed) return ''; // empty sections stay hidden, unless there is an error to show
      const fold = folded.has(k) && !q; // a search opens every section
      return `<div class="sec" data-fold="${esc(k)}"><b>${esc(groupName(k))} · ${rows.length}</b><span class="muted ${s.failed ? 'bad' : ''}">${esc(s.status)}</span><span>${fold ? '▸' : '▾'}</span></div>`
        + (fold ? '' : rows.map(rowHtml).join(''));
    }).join('');
}

$('#login').onsubmit = e => {
  e.preventDefault();
  const v = $('#token').value;
  localStorage.setItem('token', v); groups.forEach(g => g.token = v); saveGroups(); // one token for this whole server
  $('#login').hidden = true;
  syncAll();
};

$('#add').onsubmit = e => {
  e.preventDefault();
  const c = { id: crypto.randomUUID(), label: $('#label').value.trim(), tags: '', notifyAfterMs: null, nfcTagId: null, updatedAt: Date.now(), deleted: false, archived: false };
  $('#label').value = '';
  commit(view === 'all' ? '' : view, { counters: [c], events: [event(c.id, 'create')] }); // into the group being looked at, else Ungrouped
};

$('#tags').onclick = e => {
  if (e.target.closest('[data-archived]')) { showArchived = !showArchived; render(); }
  const t = e.target.closest('[data-tag]')?.dataset.tag;
  if (t) { filter = filter === t ? null : t; render(); }
};

$('#list').onsubmit = e => {
  e.preventDefault();
  const f = new FormData(e.target), amount = Number(f.get('amount')), id = e.target.dataset.edit;
  document.activeElement.blur();
  commit(ownerOf(id), { counters: [{ ...counterOf(id), label: f.get('label').trim(), tags: tagList(f.get('tags')).join(','),
    notifyAfterMs: amount > 0 ? amount * UNITS.find(([u]) => u === f.get('unit'))[1] : null, updatedAt: Date.now() }], events: [] });
};

$('#list').onclick = e => {
  const sec = e.target.closest('[data-fold]');
  if (sec) {
    const k = sec.dataset.fold;
    folded.has(k) ? folded.delete(k) : folded.add(k);
    localStorage.setItem('folded', JSON.stringify([...folded]));
    return render();
  }
  const d = e.target.dataset;
  if (d.reset) {
    e.preventDefault();
    const ev = event(d.reset, 'manual'), k = ownerOf(d.reset);
    commit(k, { counters: [], events: [ev] });
    showUndo(t('reset_label', counterOf(d.reset).label), ev, k);
  }
  if (d.resetAt) {
    const f = e.target.closest('form').elements, v = f.at.value, at = v ? new Date(v).getTime() : Date.now();
    if (at > Date.now()) return alert(t('pick_past'));
    commit(ownerOf(d.resetAt), { counters: [], events: [{ ...event(d.resetAt, 'manual', at), ...(f.note.value.trim() && { note: f.note.value.trim() }) }] });
    document.activeElement.blur();
  }
  if (d.avg) {
    const f = e.target.closest('form').elements, a = Number(d.avg);
    const [u, n] = a < 1728e5 ? UNITS[1] : UNITS[2]; // hours under 2 days, else days
    f.unit.value = u; f.amount.value = Math.max(1, Math.round(a / n));
  }
  if (d.archive) {
    const c = counterOf(d.archive);
    document.activeElement.blur();
    commit(ownerOf(d.archive), { counters: [{ ...c, archived: !c.archived, updatedAt: Date.now() }], events: [] });
  }
  if (d.delEvent) { const k = ownerOfEvent(d.delEvent); commit(k, { counters: [], events: [{ ...store(k).state.events.find(x => x.id === d.delEvent), deleted: true }] }); }
  if (d.unpair) commit(ownerOf(d.unpair), { counters: [{ ...counterOf(d.unpair), nfcTagId: null, updatedAt: Date.now() }], events: [] });
  if (d.del && confirm(t('confirm_delete')))
    commit(ownerOf(d.del), { counters: [{ ...counterOf(d.del), deleted: true, updatedAt: Date.now() }], events: [] });
};

let undoTimer;
function showUndo(text, ev, k) {
  $('#undo span').textContent = text; $('#undo').hidden = false;
  $('#undo button').onclick = () => { $('#undo').hidden = true; commit(k, { counters: [], events: [{ ...ev, deleted: true }] }); };
  clearTimeout(undoTimer); undoTimer = setTimeout(() => $('#undo').hidden = true, 8000);
}
$('#q').oninput = render;
$('#lang').value = saved || '';
$('#lang').onchange = () => { try { $('#lang').value ? localStorage.setItem('lang', $('#lang').value) : localStorage.removeItem('lang'); } catch {} location.reload(); };
$('#sort').onchange = () => { localStorage.setItem('sort', $('#sort').value); render(); };
$('#group').onchange = () => { view = $('#group').value; render(); };
$('#newgroup').onclick = newGroup;
$('#addgroup').onclick = () => { const link = prompt(t('paste_link')); if (link) join(link); };
$('#rename').onclick = renameGroup;
$('#forget').onclick = forgetGroup;

if (location.hash.length > 1) { // opened from a share link: remember the group, then hide the key from the address bar
  const frag = location.hash.slice(1);
  history.replaceState(null, '', location.pathname + location.search);
  join(frag);
}
render();
syncAll();
setInterval(syncAll, 15 * 60000); // pick up changes from the phone
setInterval(render, 60000); // keep the times current between syncs
document.addEventListener('visibilitychange', () => document.hidden || syncAll()); // fresh data when coming back to the tab
</script>
</body>
</html>
